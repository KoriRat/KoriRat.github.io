# Главные настройки сайта.
#
# Этот файл НЕ перечитывается автоматически, пока работает `bundle exec jekyll serve`.
# После изменений здесь перезапустите сервер.
#
# Шпаргалка по YAML: https://learnxinyminutes.com/docs/ru-ru/yaml-ru/

# ---------------------------------------------------------------------------
# О сайте
# ---------------------------------------------------------------------------
title: Лунная дрожь
email: KoriRaa@proton.me
description: >- # текст ниже можно писать в несколько строк, он склеится в один абзац
  Место, полное безумие, страхов и человеческих пороков.
  Люди здесь связаны оковами своего разума и не могут выбраться из него.
  Лишь некоторые способны пробится к настоящей луне.

# Короткая подпись во вкладке браузера на главной: «Лунная дрожь | Вселенная Луны»
tagline: Вселенная Луны

lang: ru       # язык сайта (для браузеров и поисковиков)
locale: ru_RU

# Адрес сайта. Нужен для RSS-ленты, превью ссылок в соцсетях и поисковиков.
url: "https://korirat.github.io"
baseurl: "" # оставьте пустым: сайт открывается с корня домена

# ---------------------------------------------------------------------------
# Соцсети (показываются внизу каждой страницы)
# ---------------------------------------------------------------------------
# Пишите только имя пользователя — без «@» и без ссылки, ссылка соберётся сама.
# Чтобы скрыть соцсеть, удалите строку или поставьте # в её начале.
github_username:    KoriRat     # → https://github.com/KoriRat
x_username:         koRat       # → https://x.com/koRat           (бывший Twitter)
instagram_username: kori_rat    # → https://www.instagram.com/kori_rat/
tiktok_username:    Kori_Rat    # → https://www.tiktok.com/@Kori_Rat

# ---------------------------------------------------------------------------
# Оформление
# ---------------------------------------------------------------------------
# Цветовая схема. Все схемы и их цвета лежат в файле _data/skins.yml —
# там же можно поменять цвета или добавить свою схему.
# Доступно сразу: luna (тёмная лунная), dawn (светлая), blood (тёмно-красная).
skin: luna

# Значок сайта во вкладке браузера (квадратная картинка .png, лучше 512×512).
# Сейчас это заглушка из темы PaperWiki (тукан) — замените файл или путь на свой.
favicon: /assets/images/favicon.png

# Логотип слева от названия сайта в шапке. Положите картинку в assets/images/,
# уберите # в начале строки и впишите путь к файлу.
# logo: /assets/images/logo.png

# Где показывать портал, категории и теги в статье: true — над текстом, false — под ним.
entry_tags_top: true

# ---------------------------------------------------------------------------
# Технические настройки (обычно трогать не нужно)
# ---------------------------------------------------------------------------
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections_dir: collections # папка, где лежат коллекции
collections:
  wiki:
    output: true                    # для каждой статьи создаётся страница
    permalink: /:collection/:title  # адрес статьи: /wiki/имя-файла

# Значения по умолчанию, чтобы не писать layout в каждой странице.
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "wiki"   # все статьи из collections/_wiki
    values:
      layout: "wiki"
      excerpt_separator: "" # описание карточки берётся из description или первого абзаца

# Эти файлы не попадают на сайт.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
