<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <h2 class="footer-heading">{{ site.title | escape }}</h2>

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">Связаться с нами:</li>
          {%- if site.email -%}
            <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
          {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        {%- include social.html -%}
      </div>

      <div class="footer-col footer-col-3">
        <p>{{- site.description | escape -}}</p>
      </div>
    </div>

    <p class="footer-credits">
      Сайт собран на <a href="https://jekyllrb.com/">Jekyll</a> с темой
      <a href="https://github.com/jekyll/minima">Minima</a> и элементами
      <a href="https://github.com/pomeloshark/jekyll-theme-paperwiki">PaperWiki</a> (лицензия MIT).
      Поиск — <a href="https://lunrjs.com/">Lunr.js</a>.
    </p>

  </div>

</footer>
